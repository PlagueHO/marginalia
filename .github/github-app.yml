instructions: Use `aspire run` to start the application. Use aspire MCP server tools to select AppHost and open `frontend` resource.
scripts:
- name: 'app: dev'
  command: pnpm --dir marginalia-app dev
- name: 'app: install'
  command: pnpm --dir marginalia-app install
- name: 'app: build'
  command: pnpm --dir marginalia-app build
- name: 'app: lint'
  command: pnpm --dir marginalia-app lint
- name: 'app: lint (fix)'
  command: pnpm --dir marginalia-app lint --fix
- name: 'app: preview'
  command: pnpm --dir marginalia-app preview
- name: 'app: test'
  command: pnpm --dir marginalia-app test
- name: 'app: test (watch)'
  command: pnpm --dir marginalia-app test:watch
- name: 'app: test (accessibility)'
  command: pnpm --dir marginalia-app test -- -t accessibility
- name: 'aspire: run'
  command: dotnet run --project marginalia-service\src\Orchestration\AppHost\AppHost.csproj
- name: 'service: build'
  command: dotnet build marginalia-service\Marginalia.slnx
- name: 'service: test'
  command: dotnet test marginalia-service\Marginalia.slnx
- name: 'service: test (watch)'
  command: dotnet watch test --solution marginalia-service\Marginalia.slnx
- name: 'service: clean'
  command: dotnet clean marginalia-service\Marginalia.slnx
- name: 'service: restore'
  command: dotnet restore marginalia-service\Marginalia.slnx
- name: 'service: format'
  command: dotnet format marginalia-service\Marginalia.slnx
- name: 'service: format (verify)'
  command: dotnet format marginalia-service\Marginalia.slnx --verify-no-changes
- name: 'service: test (unit)'
  command: dotnet test marginalia-service\tests\unit\Marginalia.Tests.Unit.csproj --configuration Release --results-directory marginalia-service\TestResults --coverage --coverage-output-format cobertura --report-trx
- name: 'service: test (integration)'
  command: dotnet test marginalia-service\tests\integration\Marginalia.Tests.Integration.csproj --configuration Release --results-directory marginalia-service\TestResults
- name: 'service: test (integration - Orchestration)'
  command: dotnet test marginalia-service\tests\integration\Orchestration.IntegrationTests\Marginalia.Orchestration.IntegrationTests.csproj --configuration Release --results-directory marginalia-service\TestResults
- name: 'service: code coverage (report)'
  command: reportgenerator -reports:marginalia-service\TestResults\**\*.cobertura.xml -targetdir:marginalia-service\TestResults\CoverageReport "-reporttypes:Html;MarkdownSummaryGithub" -assemblyfilters:+Marginalia.*
- name: 'infra: build (bicep)'
  command: pwsh -NoProfile -Command "Get-ChildItem -Path infra -Recurse -Filter *.bicep | ForEach-Object { az bicep build --file $_.FullName }"
- name: 'markdown: lint'
  command: pnpm lint:md
- name: 'markdown: lint (fix)'
  command: pnpm lint:md:fix
- name: 'markdown: lint (ci)'
  command: pnpm lint:md:ci
automation:
  auto_issue_session: true
  remote_control: true
