# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot
#
# dependabot-monthly-v1: monthly version updates on the first of the month;
# security updates remain event-driven.

version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Pacific/Auckland"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps"
    labels:
      - "dependencies"
      - "github-actions"
    rebase-strategy: "auto"
    groups:
      github-actions-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  # DevContainer features and configuration
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Pacific/Auckland"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps"
    labels:
      - "dependencies"
      - "devcontainers"
    rebase-strategy: "auto"
    groups:
      devcontainers-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      devcontainers-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  # Docker dependencies for containerization
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Pacific/Auckland"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps"
    labels:
      - "dependencies"
      - "docker"
    rebase-strategy: "auto"
    groups:
      docker-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  # Docker dependencies for containerization of API service
  - package-ecosystem: "docker"
    directory: "/marginalia-service/src/Api"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Pacific/Auckland"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps"
    labels:
      - "dependencies"
      - "docker"
    rebase-strategy: "auto"
    groups:
      docker-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  # .NET SDK and MSBuild SDK versions (global.json)
  - package-ecosystem: "dotnet-sdk"
    directory: "/marginalia-service"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Pacific/Auckland"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps"
    labels:
      - "dependencies"
      - "dotnet-sdk"
    rebase-strategy: "auto"
    groups:
      dotnet-sdk-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      dotnet-sdk-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  # .NET dependencies (backend services)
  - package-ecosystem: "nuget"
    directory: "/marginalia-service"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Pacific/Auckland"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps"
    labels:
      - "dependencies"
      - "nuget"
    rebase-strategy: "auto"
    groups:
      nuget-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      nuget-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    allow:
      - dependency-type: "all"

  # NPM dependencies for repository tooling
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Pacific/Auckland"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps"
    labels:
      - "dependencies"
      - "npm"
    rebase-strategy: "auto"
    groups:
      npm-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    allow:
      - dependency-type: "all"

  # NPM dependencies for docs site
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Pacific/Auckland"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps"
    labels:
      - "dependencies"
      - "npm"
    rebase-strategy: "auto"
    groups:
      npm-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    allow:
      - dependency-type: "all"

  # NPM dependencies for React app
  - package-ecosystem: "npm"
    directory: "/marginalia-app"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Pacific/Auckland"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps"
    labels:
      - "dependencies"
      - "npm"
    rebase-strategy: "auto"
    groups:
      npm-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    allow:
      - dependency-type: "all"
    ignore:
      # Ignore major React updates until verified with constitution
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # Azure Bicep modules (infrastructure as code)
  # Note: Dependabot doesn't natively support Bicep registries
  # This is a placeholder for future support or custom tooling
  # For now, use manual checks via update-avm-modules-in-bicep.prompt.md
